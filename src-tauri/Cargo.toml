[package]
name = "monosodium-desktop"
version = "1.14.28"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monosodium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Release binary: optimise for size + strip symbols. Smaller code means a smaller download,
# fewer resident code pages, and slightly faster startup. `opt-level = "s"` keeps the optimiser
# from the aggressive inlining that bloats the binary without measurably helping this
# I/O-bound workload; `lto`/`codegen-units = 1` let the linker drop dead code across crates.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.0"
tauri-plugin-store = "2.4.4"
reqwest = { version = "0.13.4", features = ["json", "query", "multipart"] }
governor = "0.10.4"
tokio = { version = "1.53.1", features = ["full"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
dirs = "6.0.0"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
rand = "0.8.5"

