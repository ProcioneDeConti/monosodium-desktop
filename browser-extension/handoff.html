<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opening in Monosodium Desktop…</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0e0e14; color: #ececf2; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 420px; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 18px; margin: 12px 0 4px; }
      p { opacity: 0.7; margin: 0 0 20px; word-break: break-all; font-size: 13px; }
      .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      button {
        font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
        border: 1px solid #ffffff22; background: #ffffff10; color: inherit;
      }
      button.primary { background: #00549e; border-color: #00549e; }
      button:hover { filter: brightness(1.2); }
      small { display: block; margin-top: 18px; opacity: 0.5; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/128.png" alt="" />
      <h1>Opened in Monosodium Desktop</h1>
      <p id="url"></p>
      <div class="row">
        <button class="primary" id="close">Close tab</button>
        <button id="retry">Open again</button>
        <button id="browser">View in browser instead</button>
      </div>
      <small>Nothing happened? Make sure Monosodium Desktop is installed and has been run once.<br />
        Click the extension's toolbar icon to pause it.</small>
    </main>
    <script src="handoff.js"></script>
  </body>
</html>
